name: PureWeb Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ১. কোড চেকআউট করা
    - uses: actions/checkout@v3

    # ২. Java ১৭ সেটআপ করা (Android এর জন্য প্রয়োজন)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # ৩. Gradle এর এক্সিকিউশন পারমিশন দেওয়া
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ৪. Debug APK বিল্ড করা
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # ৫. GitHub Release তৈরি করা এবং APK আপলোড করা
    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main' # শুধু main ব্রাঞ্চে পুশ দিলেই রিলিজ হবে
      with:
        tag_name: v1.0.${{ github.run_number }} # অটোমেটিক ভার্সন ট্যাগ (যেমন: v1.0.5)
        name: PureWeb Release ${{ github.run_number }}
        body: |
          New build for PureWeb Browser.
          - Updated with latest code.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
