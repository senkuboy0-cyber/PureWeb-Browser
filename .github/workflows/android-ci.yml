name: PureWeb Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # --- এখানে ম্যাজিক শুরু (Auto Fix) ---
    - name: Setup Gradle Wrapper
      run: |
        # ১. gradle wrapper ফোল্ডার তৈরি
        mkdir -p gradle/wrapper
        
        # ২. সঠিক gradle-wrapper.jar ডাউনলোড (এটি ছাড়া বিল্ড হয় না)
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/AntennaPod/AntennaPod/raw/master/gradle/wrapper/gradle-wrapper.jar
        
        # ৩. সঠিক gradlew স্ক্রিপ্ট ডাউনলোড করা (এটি ভাঙা স্ক্রিপ্ট ঠিক করবে)
        curl -L -o gradlew https://github.com/AntennaPod/AntennaPod/raw/master/gradlew
        
        # ৪. পারমিশন দেওয়া
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: PureWeb Release ${{ github.run_number }}
        body: |
          PureWeb Browser Auto Build.
          Features: GeckoView, uBlock Origin, Dark Theme.
        files: |
          app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
