name: PureWeb Build & Release

on:
  push:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Project Files
        run: |
          mkdir -p gradle/wrapper

          echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

          curl -L -o gradle/wrapper/gradle-wrapper.jar \
          https://github.com/AntennaPod/AntennaPod/raw/master/gradle/wrapper/gradle-wrapper.jar

          curl -L -o gradlew \
          https://github.com/AntennaPod/AntennaPod/raw/master/gradlew

          chmod +x gradlew

          if [ ! -f "settings.gradle" ]; then
            echo "rootProject.name='PureWeb'" > settings.gradle
            echo "include ':app'" >> settings.gradle
          fi

          if [ ! -f "build.gradle" ]; then
            echo "plugins { id 'com.android.application' version '8.9.1' apply false }" > build.gradle
          fi

      - name: Build Split Debug APKs
        run: ./gradlew assembleDebug

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PureWeb-Split-APKs
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PureWeb Release ${{ github.run_number }}
          body: |
            PureWeb Browser Auto Build (2026)

            Included APKs:
            - arm64-v8a
            - armeabi-v7a
            - x86
            - x86_64

          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
