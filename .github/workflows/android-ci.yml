name: PureWeb Build & Release

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    # =================================================
    # এখানে ভার্সন 8.2 করা হয়েছে (আগে 8.0 ছিল)
    # =================================================
    - name: Setup Project Files
      run: |
        mkdir -p gradle/wrapper
        
        # gradle-wrapper.properties ফাইল তৈরি (Gradle 8.2)
        echo "distributionBase=GRADLE_USER_HOME" > gradle/wrapper/gradle-wrapper.properties
        echo "distributionPath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties
        echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStoreBase=GRADLE_USER_HOME" >> gradle/wrapper/gradle-wrapper.properties
        echo "zipStorePath=wrapper/dists" >> gradle/wrapper/gradle-wrapper.properties

        # বাকি ফাইলগুলো ডাউনলোড
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/AntennaPod/AntennaPod/raw/master/gradle/wrapper/gradle-wrapper.jar
        curl -L -o gradlew https://github.com/AntennaPod/AntennaPod/raw/master/gradlew
        chmod +x gradlew

        # settings.gradle এবং build.gradle যদি মিসিং থাকে (তৈরি করে নেয়)
        if [ ! -f "settings.gradle" ]; then
          echo "rootProject.name='PureWeb'" > settings.gradle
          echo "include ':app'" >> settings.gradle
        fi

        if [ ! -f "build.gradle" ]; then
          echo "plugins { id 'com.android.application' version '8.2.0' apply false }" > build.gradle
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v1
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: PureWeb Release ${{ github.run_number }}
        body: "PureWeb Browser Auto Build."
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
